apiVersion: apps/v1
kind: Deployment
metadata:
  name: bihand-api
  namespace: bihand
  labels:
    service: bihand-api
spec:
  replicas: 1
  selector:
    matchLabels:
      service: bihand-api
  template:
    metadata:
      labels:
        service: bihand-api
    spec:
      # Workload Identity — binds this KSA to a GCP service account with
      # the IAM roles DEPLOYMENT.md describes (compute.instanceAdmin.v1 for
      # provisioning, storage access for the GCS-backed studios). Omit this
      # field entirely if you're not on GKE / not using Workload Identity.
      serviceAccountName: bihand-ksa
      containers:
        - name: api
          image: <YOUR_REGION>-docker.pkg.dev/<YOUR_PROJECT_ID>/<YOUR_REPO>/bihand-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: PORT
              value: "8501"
            - name: REDIS_URL
              value: redis://bihand-redis-service:6379/0
          envFrom:
            - secretRef:
                name: bihand-secrets
            - configMapRef:
                name: bihand-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8501
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8501
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bihand-api-service
  namespace: bihand
spec:
  type: NodePort
  selector:
    service: bihand-api
  ports:
    - port: 80
      targetPort: 8501
