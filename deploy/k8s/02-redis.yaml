apiVersion: apps/v1
kind: Deployment
metadata:
  name: bihand-redis
  namespace: bihand
  labels:
    service: bihand-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      service: bihand-redis
  template:
    metadata:
      labels:
        service: bihand-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bihand-redis-service
  namespace: bihand
spec:
  selector:
    service: bihand-redis
  ports:
    - port: 6379
      targetPort: 6379
