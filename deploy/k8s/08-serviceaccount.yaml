# Kubernetes-side half of GKE Workload Identity. Bind it to a GCP service
# account carrying the IAM roles described in DEPLOYMENT.md — see that
# doc's IAM section for the gcloud commands (annotate the GCP SA and grant
# it roles/iam.workloadIdentityUser for
# <PROJECT_ID>.svc.id.goog[bihand/bihand-ksa]). Not using GKE, or not using
# Workload Identity? Drop this file and the serviceAccountName lines in
# 04-api.yaml/05-worker.yaml/06-beat.yaml, and mount a GCP service-account
# JSON via GOOGLE_APPLICATION_CREDENTIALS instead (the same as local dev).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bihand-ksa
  namespace: bihand
  annotations:
    iam.gke.io/gcp-service-account: <YOUR_GCP_SERVICE_ACCOUNT_EMAIL>
